<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kasane ロゴ案一覧</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;500;600;700;800;900&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Zen+Maru+Gothic:wght@700&display=swap">
<style>
/* Layout: a contact sheet — rounds in the order they were made, each a row of equal specimen cards on a quiet grey ground */
:root{
  --bg:#F1F3F5; --plate:#FFFFFF; --fg:#121820; --muted:#5D6670; --line:#DCE0E5;
  --ai:#1F3A5F; --asagi:#1E9DB0; --moegi:#8DB83A; --vivid:#0A64C8; --gunjo:#1F3BE0; --onv:#FFFFFF;
  --l1:#13294B; --l2:#1E4F8F; --l3:#2C7DC0; --l4:#4BB0D8; --l5:#9FD9EC;
  --p1:#24427A; --p2:#2E86C1; --p3:#5A9E48; --p4:#E2A529; --p5:#D9667E;
  --rec:#1F3BE0; --warn:#B4412F;
  --t1:#172CA8; --t2:#2F48DD; --t3:#6F82F0; --t4:#A9B6FA; --t5:#D9DFFD;
  --blend:multiply;
  --display:"Urbanist","Helvetica Neue",Arial,sans-serif;
  --jp:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --round:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1117; --plate:#151B23; --fg:#EBEFF3; --muted:#98A2AD; --line:#27303A;
  --ai:#7FA6D6; --asagi:#3CC3D6; --moegi:#A8D45A; --vivid:#4D9BF0; --gunjo:#7C8CFF;
  --l1:#EAF3FA; --l2:#A9D7EE; --l3:#5DB3E0; --l4:#2F82C4; --l5:#2A5A9A;
  --p1:#7FA4E6; --p2:#58AEE2; --p3:#86C46F; --p4:#F0BE4E; --p5:#EE8EA3;
  --rec:#8C9BFF; --warn:#E07A66; --t1:#E2E7FF; --t2:#A9B6FA; --t3:#7C8CFF; --t4:#4458D8; --t5:#2A3590; --blend:screen; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1117; --plate:#151B23; --fg:#EBEFF3; --muted:#98A2AD; --line:#27303A;
  --ai:#7FA6D6; --asagi:#3CC3D6; --moegi:#A8D45A; --vivid:#4D9BF0; --gunjo:#7C8CFF;
  --l1:#EAF3FA; --l2:#A9D7EE; --l3:#5DB3E0; --l4:#2F82C4; --l5:#2A5A9A;
  --p1:#7FA4E6; --p2:#58AEE2; --p3:#86C46F; --p4:#F0BE4E; --p5:#EE8EA3;
  --rec:#8C9BFF; --warn:#E07A66; --t1:#E2E7FF; --t2:#A9B6FA; --t3:#7C8CFF; --t4:#4458D8; --t5:#2A3590; --blend:screen; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--jp);line-height:1.75;font-size:15px}
.wrap{max-width:1180px;margin:0 auto;padding-block:40px 80px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:52px}
.eyebrow{font-family:var(--display);font-weight:600;letter-spacing:.2em;text-transform:uppercase;font-size:11.5px;color:var(--muted)}
h1{margin:0;font-weight:900;font-size:clamp(28px,4.4vw,42px);line-height:1.3}
header{display:flex;flex-direction:column;gap:12px}
header p{margin:0;color:var(--muted);max-width:66ch}
.toc{display:flex;flex-wrap:wrap;gap:8px}
.toc a{font-size:13px;color:var(--fg);text-decoration:none;border:1px solid var(--line);background:var(--plate);border-radius:999px;padding:5px 12px}
.toc a:hover{border-color:var(--fg)}
.toc a:focus-visible,.round a:focus-visible{outline:2px solid var(--rec);outline-offset:2px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}

.round{display:flex;flex-direction:column;gap:14px;scroll-margin-top:16px}
.rhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px}
.rhead .l{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.rno{font-family:var(--display);font-weight:900;font-size:14px;color:var(--muted);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.rhead h2{margin:0;font-size:20px;font-weight:900}
.rhead p{margin:0;font-size:13.5px;color:var(--muted);flex-basis:100%}
.rhead a{font-size:13px;color:var(--rec);text-decoration:none;white-space:nowrap}
.rhead a:hover{text-decoration:underline}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}
.card{background:var(--plate);border:1px solid var(--line);border-radius:3px;display:flex;flex-direction:column;min-width:0}
.card.is-rec{border-color:var(--rec)}
.stage{height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:14px;border-bottom:1px solid var(--line);overflow:hidden}
.stage svg{width:104px;height:104px;flex:none}
.stage .row4{display:grid;grid-template-columns:repeat(2,52px);gap:10px}
.stage .row4 svg{width:52px;height:52px}
.info{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}
.ttl{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ttl b{font-family:var(--display);font-weight:800;font-size:12px;color:var(--muted);letter-spacing:.06em}
.ttl h3{margin:0;font-size:15px;font-weight:700}
.info p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.65}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;border:1px solid currentColor}
.chip.rec{color:var(--rec)}
.chip.warn{color:var(--warn)}

/* wordmark helpers (round 1, 3, 4, 8) */
.w-a{position:relative;font-family:var(--display);font-weight:700;font-size:40px;letter-spacing:-.02em;line-height:1}
.w-a span{display:block}
.w-a .back{position:absolute;inset:0;color:var(--asagi);transform:translate(.06em,.06em);mix-blend-mode:var(--blend)}
.w-a .front{position:relative;color:var(--ai);mix-blend-mode:var(--blend)}
.w-b{font-family:var(--display);font-weight:800;font-size:42px;line-height:1;background:linear-gradient(180deg,var(--ai) 0 46%,var(--asagi) 46% 70%,var(--moegi) 70% 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.w-d{font-family:var(--display);font-weight:600;font-size:42px;line-height:1;display:flex}
.w-d span{margin-right:-.11em;mix-blend-mode:var(--blend)}
.w-d span:nth-child(odd){color:var(--ai)}.w-d span:nth-child(even){color:var(--asagi)}.w-d span:last-child{margin-right:0}
.w-c{display:flex;align-items:center;gap:8px}
.w-c svg{width:44px;height:44px}
.w-c span{font-family:var(--display);font-weight:500;font-size:28px;letter-spacing:.12em}
.slice,.diag{position:relative;font-family:var(--display);font-weight:900;font-size:36px;line-height:1;color:var(--fg)}
.slice span,.diag span{display:block}
.slice .t{clip-path:inset(0 0 50% 0)}
.slice .b{position:absolute;inset:0;clip-path:inset(56% 0 0 0);transform:translateX(.07em);color:var(--vivid)}
.diag .t{clip-path:polygon(0 0,100% 0,100% 36%,0 60%)}
.diag .b{position:absolute;inset:0;clip-path:polygon(0 66%,100% 42%,100% 100%,0 100%);transform:translateX(.08em);color:var(--vivid)}
.stack{display:grid;grid-template-columns:repeat(2,.74em);font-family:var(--display);font-weight:900;font-size:46px;line-height:.76;color:var(--gunjo);text-align:center}
.tate{background:var(--gunjo);color:var(--onv);font-weight:900;display:flex;flex-direction:column;align-items:center;line-height:1;font-size:34px;padding:10px 12px;gap:1px;border-radius:2px}
.kana{font-family:var(--round);font-weight:700;font-size:18px;letter-spacing:.14em;color:var(--fg)}
.foot{font-size:13px;color:var(--muted);margin:0}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">Kasane — Logo archive</div>
    <h1>Kasane ロゴ案一覧</h1>
    <p>これまでに出したロゴ案を、作った順にすべて並べました。各回の右上のリンクから、くわしい説明や使用例のある元のページを開けます。</p>
    <div class="legend"><span><i class="chip rec">おすすめ</i>その回でおすすめした案</span><span><i class="chip warn">要修正</i>使う前に直しが必要な案</span></div>
    <nav class="toc" id="toc" aria-label="回ごとの目次"></nav>
  </header>
  <div id="rounds" style="display:flex;flex-direction:column;gap:52px"></div>
  <p class="foot">第3回以降の案は、佐藤可士和さん・永井一正さんの考え方を参考にした独自の案で、ご本人の作品やご監修ではありません。採用前には商標調査をおすすめします。</p>
</div>

<script>
let uid=0; const id=p=>p+(uid++);
const svg=(inner,vb="0 0 100 100")=>`<svg viewBox="${vb}" aria-hidden="true">${inner}</svg>`;
const B="mix-blend-mode:var(--blend)";

/* ---------- round 2 symbols ---------- */
const SYM={
  stack:`<path d="M18 16 H82 L70 42 H6 Z" style="fill:var(--ai)"/><path d="M24 37 H88 L76 63 H12 Z" style="fill:var(--asagi);${B}"/><path d="M30 58 H94 L82 84 H18 Z" style="fill:var(--moegi);${B}"/>`,
  eri:`<path d="M90 12 H66 L32 88 H56 Z" style="fill:var(--asagi)"/><path d="M10 12 H34 L68 88 H44 Z" style="fill:var(--ai);${B}"/><path d="M41 12 H59 L50 32 Z" style="fill:var(--moegi)"/>`,
  k:`<rect x="16" y="12" width="22" height="76" style="fill:var(--ai)"/><path d="M26 54 L66 12 H92 L46 60 Z" style="fill:var(--asagi);${B}"/><path d="M26 46 L66 88 H92 L46 40 Z" style="fill:var(--moegi);${B}"/>`,
  win:`<rect x="10" y="10" width="50" height="50" rx="7" style="fill:var(--ai)"/><rect x="25" y="25" width="50" height="50" rx="7" style="fill:var(--asagi);${B}"/><rect x="40" y="40" width="50" height="50" rx="7" style="fill:var(--moegi);${B}"/>`,
  musubi:`<circle cx="37" cy="50" r="29" style="fill:var(--ai)"/><circle cx="63" cy="50" r="29" style="fill:var(--asagi);${B}"/><path d="M50 24.1 A29 29 0 0 1 50 75.9 A29 29 0 0 1 50 24.1 Z" style="fill:var(--moegi);${B}"/>`,
  iso:`<path d="M50 50 L88 69 L50 88 L12 69 Z" style="fill:var(--moegi)"/><path d="M50 31 L88 50 L50 69 L12 50 Z" style="fill:var(--asagi);${B}"/><path d="M50 12 L88 31 L50 50 L12 31 Z" style="fill:var(--ai);${B}"/>`
};

/* ---------- round 3 ---------- */
function n1(){let s="";[[38,"var(--ai)"],[62,"var(--asagi)"]].forEach(([cx,c])=>{for(let r=3;r<=33;r+=3)s+=`<circle cx="${cx}" cy="50" r="${r}" fill="none" stroke-width=".9" style="stroke:${c};${B}"/>`});return svg(s)}
function n2(){let s="";for(let i=0;i<=8;i++){const t=i/8;s+=`<line x1="${66+24*t}" y1="12" x2="${32+24*t}" y2="88" stroke-width="1.1" style="stroke:var(--asagi);${B}"/><line x1="${10+24*t}" y1="12" x2="${44+24*t}" y2="88" stroke-width="1.1" style="stroke:var(--ai);${B}"/>`}return svg(s+`<path d="M43 12 H57 L50 27 Z" style="fill:var(--moegi)"/>`)}
function n3(){let s="";for(let k=0;k<4;k++)s+=`<rect x="24" y="24" width="52" height="52" fill="none" stroke-width="1" transform="rotate(${k*22.5} 50 50)" style="stroke:var(--ai)"/>`;for(let r=6;r<=18;r+=4)s+=`<circle cx="50" cy="50" r="${r}" fill="none" stroke-width=".8" style="stroke:var(--asagi)"/>`;return svg(s+`<circle cx="50" cy="50" r="2.6" style="fill:var(--moegi)"/>`)}

/* ---------- round 4/5: solid square + patterned square, overlap knocked out ---------- */
function patt(type,x,y,a,fill){
  let s="";
  if(type==="h") for(let i=0;i<14;i++) s+=`<rect x="${x}" y="${y+1+i*4}" width="${a}" height="2" fill="${fill}"/>`;
  else if(type==="v") for(let i=0;i<14;i++) s+=`<rect x="${x+1+i*4}" y="${y}" width="2" height="${a}" fill="${fill}"/>`;
  else if(type==="d"){for(let i=-20;i<=20;i++) s+=`<rect x="${x+a/2+i*4-1}" y="${y-a}" width="2" height="${a*3}" fill="${fill}" transform="rotate(-45 ${x+a/2} ${y+a/2})"/>`}
  else for(let i=0;i<7;i++)for(let j=0;j<7;j++) s+=`<circle cx="${x+4+i*8}" cy="${y+4+j*8}" r="2.3" fill="${fill}"/>`;
  return s;
}
function layered(type="h",color="var(--vivid)"){
  const m=id("m"),c=id("c"),o=id("o");
  return svg(`<defs>
    <clipPath id="${c}"><rect x="36" y="36" width="56" height="56"/></clipPath>
    <clipPath id="${o}"><rect x="36" y="36" width="28" height="28"/></clipPath>
    <mask id="${m}"><rect width="100" height="100" fill="#fff"/><rect x="36" y="36" width="28" height="28" fill="#000"/></mask>
    <mask id="${m}s"><rect width="100" height="100" fill="#fff"/><g clip-path="url(#${o})">${patt(type,36,36,56,"#000")}</g></mask></defs>
    <rect x="8" y="8" width="56" height="56" mask="url(#${m}s)" style="fill:${color}"/>
    <g clip-path="url(#${c})" mask="url(#${m})" style="fill:${color}">${patt(type,36,36,56,"currentColor").replaceAll('fill="currentColor"',`style="fill:${color}"`)}</g>`);
}

/* ---------- round 6: 襲 ---------- */
const K=.55, C5=["var(--l1)","var(--l2)","var(--l3)","var(--l4)","var(--l5)"];
function collar({colors=C5,gap="var(--plate)",clipTop=12}={}){
  const u=id("k"); let g="";
  for(let i=4;i>=0;i--){
    const ay=78-i*9, top=4, ee=i===0?12:4.5, lx=50-(ay-top)*K, rx=50+(ay-top)*K, ex=50-ee*K, ey=ay+ee;
    const arm=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-width="7.6" style="stroke:${gap}"/><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-width="6" style="stroke:${colors[i]}"/>`;
    g+=arm(lx,top,50,ay)+arm(rx,top,ex,ey);
  }
  return {u,inner:`<defs><clipPath id="${u}"><rect x="-60" y="${clipTop}" width="220" height="220"/></clipPath></defs><g clip-path="url(#${u})">${g}</g>`};
}
const kasaneMark=()=>svg(collar().inner);
function person(){
  const step=7,top=36,base=82;let s=`<circle cx="50" cy="18" r="12" style="fill:var(--l1)"/><path d="M10 52 Q10 36 26 36 H74 Q90 36 90 52 V94 H10 Z" style="fill:var(--l1)"/><line x1="50" y1="${base}" x2="${50-12*K}" y2="94" stroke-width="1.4" style="stroke:var(--plate)"/>`;
  for(let i=0;i<5;i++){const ay=base-i*step,w=(ay-top)*K,f=i<4?C5[i+1]:"var(--plate)";s+=`<polygon points="${50-w},${top} ${50+w},${top} 50,${ay}" stroke-width="1.4" style="fill:${f};stroke:var(--plate)"/>`}
  return svg(s);
}
function crest(){const u=id("cr"),c=collar({colors:["#FFFFFF","#A9D7EE","#5DB3E0","#3A8FD0","#2A62A8"],gap:"#13294B",clipTop:-60});
  return svg(`<defs><clipPath id="${u}"><circle cx="50" cy="50" r="46"/></clipPath></defs><circle cx="50" cy="50" r="46" fill="#13294B"/><g clip-path="url(#${u})"><g transform="translate(50 50) scale(1.15) translate(-50 -50)">${c.inner}</g></g>`)}
function scene(vb,clip){
  const u=id("sc"),T=-300,gw=1.5*vb[2]/100;let s=`<rect x="-400" y="-400" width="1000" height="1000" style="fill:var(--l1)"/><line x1="50" y1="78" x2="${50-400*K}" y2="478" stroke-width="${gw}" style="stroke:var(--plate)"/>`;
  for(let i=0;i<5;i++){const ay=78-i*9,w=(ay-T)*K,f=i<4?C5[i+1]:"var(--plate)";s+=`<polygon points="${50-w},${T} ${50+w},${T} 50,${ay}" stroke-width="${gw}" style="fill:${f};stroke:var(--plate)"/>`}
  const r=clip||[vb[0],vb[1],vb[2],vb[3],0];
  return svg(`<defs><clipPath id="${u}"><rect x="${r[0]}" y="${r[1]}" width="${r[2]}" height="${r[3]}" rx="${r[4]||0}"/></clipPath></defs><g clip-path="url(#${u})">${s}</g>`,vb.join(" "));
}

/* ---------- round 7: 巡り重ね ---------- */
function ring(colors){
  const u=id("r"),R=19.5,D=24,gw=2.2,P=[...Array(5)].map((_,i)=>{const a=(-90+i*72)*Math.PI/180;return[50+D*Math.cos(a),50+D*Math.sin(a)]});
  const c=i=>`<circle cx="${P[i][0].toFixed(2)}" cy="${P[i][1].toFixed(2)}" r="${R}" stroke-width="${gw}" style="fill:${colors[i%colors.length]};stroke:var(--plate)"/>`;
  let s="";for(let i=4;i>=0;i--)s+=c(i);
  return svg(s+`<defs><clipPath id="${u}"><circle cx="${P[0][0].toFixed(2)}" cy="${P[0][1].toFixed(2)}" r="${R+gw*2}"/></clipPath></defs><g clip-path="url(#${u})">${c(4)}</g>`);
}

/* ---------- round 8 ---------- */
const kk=c=>svg(`<rect x="14" y="14" width="16" height="72" style="fill:${c}"/><polyline points="66,14 36,50 66,86" fill="none" stroke-width="14" style="stroke:${c}"/><polyline points="90,14 60,50 90,86" fill="none" stroke-width="14" style="stroke:${c}"/>`);
function na1(){const u=id("c");let s="",y=10,i=0;while(y<90){const t=.8+i*.62;s+=`<rect x="0" y="${y.toFixed(2)}" width="100" height="${t.toFixed(2)}"/>`;y+=t+1.9;i++}return svg(`<defs><clipPath id="${u}"><circle cx="50" cy="50" r="40"/></clipPath></defs><g clip-path="url(#${u})" style="fill:var(--fg)">${s}</g>`)}
function na2(){let s="";for(let i=0;i<16;i++){const h=40*Math.pow(.92,i);s+=`<rect x="${(50-h).toFixed(2)}" y="${(50-h).toFixed(2)}" width="${(2*h).toFixed(2)}" height="${(2*h).toFixed(2)}" transform="rotate(${i*6} 50 50)" fill="none" stroke-width=".7" style="stroke:var(--fg)"/>`}return svg(s+`<rect x="46.5" y="46.5" width="7" height="7" transform="rotate(96 50 50)" style="fill:var(--gunjo)"/>`)}
function na3(){const m=id("m"),c=id("c");let o="",n="";for(let y=12;y<=88;y+=4){o+=`<rect x="12" y="${y}" width="76" height="2"/>`;n+=`<rect x="12" y="${y+2}" width="76" height="2"/>`}
  return svg(`<defs><mask id="${m}"><rect width="100" height="100" fill="#fff"/><circle cx="50" cy="50" r="28" fill="#000"/></mask><clipPath id="${c}"><circle cx="50" cy="50" r="28"/></clipPath></defs><g mask="url(#${m})" style="fill:var(--fg)">${o}</g><g clip-path="url(#${c})" style="fill:var(--gunjo)">${n}</g>`)}

const wa=`<div class="w-a"><span class="back" aria-hidden="true">Kasane</span><span class="front">Kasane</span></div>`;
const stackWm=`<div class="stack"><span>K</span><span>A</span><span>S</span><span>A</span><span>N</span><span>E</span></div>`;

// Round 9 marks — shared by the round-9 page and the archive page. Colours: --t1 (deepest) … --t5 (lightest), gaps in --plate.
const R9 = (() => {
  let n = 0; const id = p => p + "r9" + (n++);
  const S = (inner) => `<svg viewBox="0 0 100 100" aria-hidden="true">${inner}</svg>`;
  const G = "var(--plate)";
  // 折り重ね: one sheet with its corner folded over itself
  const fold = () => S(`<polygon points="10,10 50,10 90,50 90,90 10,90" style="fill:var(--t1)"/>
    <polygon points="50,10 90,50 50,50" stroke-width="1.6" stroke-linejoin="round" style="fill:var(--t4);stroke:${G}"/>`);
  // 末広: three sheets fanned from one pivot
  const fan = () => {
    const r = (a, c) => `<rect x="32" y="20" width="36" height="64" rx="5" transform="rotate(${a} 50 84)" stroke-width="2.4" style="fill:${c};stroke:${G}"/>`;
    return S(r(-26, "var(--t4)") + r(26, "var(--t3)") + r(0, "var(--t1)"));
  };
  // 残像K: the K repeated, each pass a layer behind the last
  const K = "20,15 36,15 36,43 62,15 82,15 51,48 84,85 63,85 36,55 36,85 20,85";
  const echo = () => S(
    `<polygon points="${K}" transform="translate(10 6)" fill="none" stroke-width="1.6" style="stroke:var(--t4)"/>` +
    `<polygon points="${K}" transform="translate(5 3)" fill="none" stroke-width="1.6" style="stroke:var(--t3)"/>` +

  const dots = () => { const u = id("c"); let a = "", b = "";

    return S(circleClip(u) + `<g clip-path="url(#${u})"><g style="fill:var(--t1)">${a}</g><g transform="rotate(12 50 50)" style="fill:var(--t3)">${b}</g></g>`); };

  const seigaiha = () => { const u = id("c"); let s = "";
    const scale = (cx, cy) => { let g = ""; [20, 15, 10, 5].forEach((r, i) => g += `<circle cx="${cx}" cy="${cy}" r="${r}" style="fill:${i % 2 ? G : "var(--t" + (i < 2 ? 1 : 2) + ")"}"/>`); return `<circle cx="${cx}" cy="${cy}" r="21.5" style="fill:${G}"/>` + g; };
    [[50, [10, 50, 90]], [60, [30, 70]], [70, [10, 50, 90]], [80, [30, 70]], [90, [10, 50, 90]], [100, [30, 70]]].forEach(([y, xs]) => xs.forEach(x => s += scale(x, y)));
    return S(`<defs><clipPath id="${u}"><rect x="10" y="30" width="80" height="60" rx="4"/></clipPath></defs><g clip-path="url(#${u})">${s}</g>`); };
  const shippo = () => { const u = id("c"); let s = "";
    for (let x = -10; x <= 110; x += 20) for (let y = -10; y <= 110; y += 20) s += `<circle cx="${x}" cy="${y}" r="20" fill="none" stroke-width="2.4" style="stroke:var(--t1)"/>`;
    return S(circleClip(u) + `<g clip-path="url(#${u})">${s}</g><circle cx="50" cy="50" r="42" fill="none" stroke-width="2.4" style="stroke:var(--t1)"/>`); };

// Round 11 — Nagai-method works. Every mark takes {c: line colour, acc: accent, bg: ground, small: simplified for ≤24px}.
const R11 = (() => {
  let n = 0; const id = p => p + "r11" + (n++);
  const S = inner => `<svg viewBox="0 0 100 100" aria-hidden="true">${inner}</svg>`;
  const f = v => +v.toFixed(2);

  // 積層日輪: a sun cut into bands whose thickness grows in equal steps; the heaviest band carries the accent
  const nichirin = ({ c, acc, small }) => {
    const u = id("c"), N = small ? 5 : 13, gap = small ? 5 : 1.6, t0 = (80 - gap * (N - 1)) / (N * (N + 1) / 2);
    let s = "", y = 10;
    for (let i = 0; i < N; i++) { const t = t0 * (i + 1); s += `<rect x="0" y="${f(y)}" width="100" height="${f(t)}" style="fill:${i === N - 1 ? acc : c}"/>`; y += t + gap; }
    return S(`<defs><clipPath id="${u}"><circle cx="50" cy="50" r="40"/></clipPath></defs><g clip-path="url(#${u})">${s}</g>`);
  };
  // 双心円: two families of concentric rings, centres one pitch apart, so the overlap breathes
  const twin = ({ c, acc, small }) => {
    const p = small ? 8 : 3.2, w = small ? 2.4 : .75; let s = "";
    [[44, c], [56, acc]].forEach(([cx, col]) => { for (let r = p; r <= 36; r += p) s += `<circle cx="${cx}" cy="50" r="${f(r)}" fill="none" stroke-width="${w}" style="stroke:${col}"/>`; });
    return S(s);
  };
  // 十六重: sixteen equal squares turned by 90°/16 each, closing into a perfect rosette
  const juroku = ({ c, acc, small }) => {
    const N = small ? 4 : 16, w = small ? 3 : .6; let s = "";
    for (let i = 0; i < N; i++) s += `<rect x="22" y="22" width="56" height="56" fill="none" stroke-width="${w}" transform="rotate(${f(i * 90 / N)} 50 50)" style="stroke:${c}"/>`;
    return S(s + `<circle cx="50" cy="50" r="${small ? 7 : 4.5}" style="fill:${acc}"/>`);
  };
  // 線の球: vertical lines that thicken inside a circle, so a sphere appears from line weight alone
  const sphere = ({ c, acc, small }) => {
    const step = small ? 10 : 3, R = 38; let s = "";
    for (let x = 12; x <= 88.01; x += step) {
      const dx = (x - 50) / R, inside = Math.abs(dx) < 1, h = inside ? R * Math.sqrt(1 - dx * dx) : 0;
      const wThin = small ? 0 : .45, wThick = (small ? 3.4 : .6) + (small ? 3 : 1.9) * (inside ? Math.sqrt(1 - dx * dx) : 0);
      if (wThin) s += `<line x1="${f(x)}" y1="10" x2="${f(x)}" y2="90" stroke-width="${wThin}" style="stroke:${c};stroke-opacity:.45"/>`;
      if (inside) s += `<line x1="${f(x)}" y1="${f(50 - h)}" x2="${f(x)}" y2="${f(50 + h)}" stroke-width="${f(wThick)}" style="stroke:${Math.abs(x - 50) < step / 2 ? acc : c}"/>`;
    }
    return S(s);
  };
  // 積層円盤: discs laid one on another, seen slightly from above; the newest disc on top carries the accent
  const discs = ({ c, acc, bg, small }) => {
    const N = small ? 3 : 9, top = 30, bottom = 74, step = (bottom - top) / (N - 1); let s = "";
    for (let i = 0; i < N; i++) { const cy = bottom - i * step, last = i === N - 1;
      s += `<ellipse cx="50" cy="${f(cy)}" rx="36" ry="12" stroke-width="${small ? 3 : .9}" style="fill:${last ? acc : bg};stroke:${last ? acc : c}"/>`; }
    return S(s);
  };
  // 生命の螺旋: seeds placed one at a time at the golden angle; each new seed is a little larger
  const spiral = ({ c, acc, small }) => {
    const N = small ? 21 : 220, k = 40 / Math.sqrt(N), GA = 137.508 * Math.PI / 180; let s = "";
    for (let i = 1; i <= N; i++) { const r = k * Math.sqrt(i), a = i * GA, d = small ? 2.2 + i / N * 3.4 : .35 + i / N * 1.9;
      s += `<circle cx="${f(50 + r * Math.cos(a))}" cy="${f(50 + r * Math.sin(a))}" r="${f(d)}" style="fill:${c}"/>`; }
    return S(s + `<circle cx="50" cy="50" r="${small ? 3.4 : 2.2}" style="fill:${acc}"/>`);
  };
  return { nichirin, twin, juroku, sphere, discs, spiral };
})();
